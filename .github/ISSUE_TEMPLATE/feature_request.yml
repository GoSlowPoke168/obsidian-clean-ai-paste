name: Feature request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - GoSlowPoke168
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: input
    id: ai_source
    attributes:
      label: Related AI Source (if applicable)
      description: If this request is about how a specific AI's output gets pasted/cleaned, name the tool and model/version.
      placeholder: "e.g., Claude Sonnet 5, ChatGPT (GPT-5.6 Sol), Gemini 3.1 Pro"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Example (Optional)
        If this is about paste formatting/cleaning behavior, show what gets pasted now vs. what you'd like instead.

  - type: textarea
    id: example_before
    attributes:
      label: Example - Before
      description: What gets pasted now.
      render: text
    validations:
      required: false

  - type: textarea
    id: example_after
    attributes:
      label: Example - After (desired)
      description: What you'd like the result to look like instead.
      render: text
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
